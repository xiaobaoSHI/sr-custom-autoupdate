name: Build personalized Shadowrocket config

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'custom/**'
      - 'tests/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-configs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build configs
        run: python scripts/build.py

      # Convert the daily output from the SAME fetch; leave build.py unchanged.
      - name: Build v2rayN routing rules
        run: python scripts/build_v2rayn.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test Clash routing rules
        run: |
          node scripts/build_clash.mjs
          node --test tests/test_clash.mjs

      - name: Test conversion and generated artifacts
        run: python -m unittest discover -s tests -v

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-routing-configs
          path: dist/

      - name: Commit generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sr_top500_banlist_custom_daily.conf dist/sr_top500_banlist_custom_privacy.conf dist/v2rayn_daily.json dist/v2rayn_daily.meta.json dist/clash_daily.yaml
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Auto update generated Shadowrocket configs"
            git push
          fi
